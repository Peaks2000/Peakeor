name: Build

concurrency:
  group: "build"
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build suffix for the release JAR
        required: true
        type: string
      client_version:
        description: Release version (defaults to Minecraft version and build suffix)
        required: false
        type: string
  push:
    branches:
      - master
      - peakeor

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build
        env:
          CLIENT_VERSION: ${{ inputs.client_version }}
        run: ./gradlew build -Pcommit=${{ github.sha }} -Pbuild_number=${{ inputs.build_number || github.run_number }} -Pclient_version="$CLIENT_VERSION"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: peakeor-client
          path: build/libs/*.jar
          if-no-files-found: error
